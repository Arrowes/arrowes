name: Update profile README

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-readme

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Update blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://wangyujie.space/atom.xml"
          max_post_count: 20

      - name: Update repositories
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: owner,
              type: "owner",
              sort: "created",
              direction: "desc",
              per_page: 100,
            })
            const list = repos
              .filter(({ fork, archived }) => !fork && !archived)
              .map(({ name, html_url }) => `* <a href='${html_url}' target='_blank'>${name}</a>`)
              .join("\n")

            const { data: file } = await github.rest.repos.getContent({
              owner,
              repo,
              path: "README.md",
            })
            const readme = Buffer.from(file.content, "base64").toString()
            const start = "<!-- START_SECTION:brain -->"
            const end = "<!-- END_SECTION:brain -->"
            const updated = readme.replace(
              new RegExp(`${start}[\\s\\S]*?${end}`),
              `${start}\n${list}\n\n${end}`,
            )

            if (updated === readme) return
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "README.md",
              message: "Updated repository list",
              content: Buffer.from(updated).toString("base64"),
              sha: file.sha,
            })
